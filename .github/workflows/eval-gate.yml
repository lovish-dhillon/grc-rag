name: eval-gate

# The CI regression gate (PRD-P3-11). Two tiers, split by cost/secrets:
#   * tier1 (every PR/push)  — deterministic recall@10, keyless. Can fail the build with no API call.
#   * check-scorecard (every PR/push) — reads the committed judge scorecard; fails if it breaches
#       the faithfulness / uncited thresholds OR is stale. Keyless.
#   * judge-refresh (schedule/dispatch only) — runs the paid Anthropic judge with the secret and
#       commits a fresh scorecard. NEVER on every push, so we don't burn cost or expose the key.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"        # nightly: refresh the judge scorecard
  workflow_dispatch:           # on-demand judge run

jobs:
  # ---- Tier 1 + scorecard check: deterministic, keyless, runs on every PR/push ----
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-minilm-crossencoder
      - run: pip install -e ".[dev]"
      # The processed index (embeddings.npz + index.jsonl) is committed, so retrieval needs no
      # ingest — only the sentence-transformer + cross-encoder weights, which the cache holds.
      - name: Tier 1 — recall@10 (deterministic, no key)
        run: python -m grc_rag.gate --tier1
      - name: Faithfulness via committed scorecard (no key; fails if stale)
        run: python -m grc_rag.gate --check-scorecard --max-age-days 14

  # ---- Judge refresh: paid, key-scoped, cadence-only (NOT every push) ----
  judge-refresh:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      # The judge needs the local generator too. Ollama + the 7B model is heavy (~5 GB), which is
      # why this job is cadence-only; for a fast loop, refresh the scorecard locally and commit it.
      - name: Start Ollama + pull the generator model
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          sleep 5
          ollama pull qwen2.5:7b
      - name: Run the judge and write the scorecard
        run: python -m grc_rag.gate --judge
      - name: Commit the refreshed scorecard
        run: |
          git config user.name  "eval-gate"
          git config user.email "eval-gate@users.noreply.github.com"
          git add data/eval/scorecard.json
          git commit -m "chore: refresh eval scorecard" || echo "no change"
          git push
